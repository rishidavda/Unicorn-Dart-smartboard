<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Winchester · TV</title>
<link rel="icon" href="/brand/icon.png" type="image/png">
<link rel="stylesheet" href="/css/common.css">
<style>
  body { overflow: hidden; cursor: none; }
  #tv { display: grid; grid-template-columns: minmax(0, 46%) 1fr; gap: 2vmin; height: 100vh; padding: 2vmin; }

  /* ---- left: board ---- */
  #left { display: flex; flex-direction: column; gap: 1.4vmin; min-height: 0; }
  #boardwrap { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #board { width: 100%; height: 100%; max-height: 100%; }
  #hit { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; }
  #hit span {
    font-size: 15vmin; line-height: 1; color: var(--amber); font-family: var(--cond); font-weight: 700;
    text-shadow: 0 0 3vmin color-mix(in srgb, var(--amber) 90%, transparent), 0 0 9vmin color-mix(in srgb, var(--amber) 45%, transparent);
  }
  #hit.go { animation: hitpop 1.5s ease-out; }
  @keyframes hitpop {
    0% { opacity: 0; transform: scale(.55) rotate(-6deg); }
    14% { opacity: 1; transform: scale(1.08) rotate(2deg); }
    26% { transform: scale(1) rotate(0); }
    72% { opacity: 1; }
    100% { opacity: 0; transform: scale(1.05); }
  }
  /* The bed a dart hit lights up for 1.6 s (board-svg.js takes the class off).
     A plain fill, not an animated one: animating an SVG fill repaints the
     whole board every frame for 1.5 s after every dart, which on a TV's slow
     CPU competed with drawing the next dart and score. */
  .db-bed.db-hit { fill: var(--amber); }

  #brandbar { display: flex; align-items: center; gap: 2vmin; margin-bottom: .8vmin; min-height: 5vmin; }
  #tvbrand { font-size: 1.9vmin; }
  #tvbrand .brand-tag { letter-spacing: .3em; }
  #brandline { flex: 1; height: 2px; background: linear-gradient(90deg, var(--pink), transparent); }
  #watermark {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; opacity: .06; font-size: 3vmin;
  }
  #watermark .brand-name { font-size: 3.4em; } #watermark .brand-tag { display: none; }

  #visit { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2vmin; }
  .slot {
    background: var(--panel); border: 2px dashed var(--line); border-radius: 1.2vmin;
    min-height: 8vmin; display: flex; align-items: center; justify-content: center;
    font-family: var(--cond); font-weight: 700; font-size: 4.6vmin; color: var(--muted);
  }
  .slot.was { border-style: solid; border-color: var(--line); color: var(--muted); }
  .slot.on { border-style: solid; border-color: var(--amber); color: var(--amber); text-shadow: 0 0 1.6vmin color-mix(in srgb, var(--amber) 60%, transparent); }
  #visitsum { text-align: center; font-family: var(--cond); font-size: 2.1vmin; letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
    min-height: 6.4vmin; display: flex; align-items: baseline; justify-content: center; gap: 1.4vmin; }
  /* The visit's running total: big and counting up as each dart lands, like
     the score graphic on a TV darts broadcast. Muted once the visit is over. */
  #visitnum { font-weight: 700; font-size: 6vmin; line-height: 1; letter-spacing: .02em; color: var(--amber);
    font-variant-numeric: tabular-nums; min-width: 2.2ch; text-align: left; }
  #visitsum.was #visitnum { color: var(--muted); }

  /* ---- right: scoreboard ---- */
  #right { display: flex; flex-direction: column; gap: 1.4vmin; min-height: 0; min-width: 0; }   /* a long title never squeezes the board */
  #head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 3px solid var(--line); padding-bottom: 1vmin; }
  #gtitle { font-family: var(--cond); font-weight: 700; font-size: 3.8vmin; letter-spacing: .1em; text-transform: uppercase; color: var(--teal);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
  #gsub { font-family: var(--cond); font-size: 2.2vmin; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 0; text-align: right; margin-left: 2vmin; }
  /* The score bug: which leg, first to how many - gold for a deciding leg. */
  #gbug { font-family: var(--cond); font-weight: 700; font-size: 2.4vmin; letter-spacing: .14em; text-transform: uppercase;
          color: var(--ink); border: 2px solid var(--line); border-radius: 1vmin; padding: .3vmin 1.2vmin; margin-left: 1.6vmin;
          white-space: nowrap; align-self: center; }
  #gbug.decider { color: #1b1300; background: var(--gold, #d4af37); border-color: var(--gold, #d4af37); }
  #ghint { font-family: var(--cond); font-size: 2.6vmin; letter-spacing: .06em; color: var(--gold);
    background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .1); border-radius: 1.2vmin;
    padding: 1vmin 1.6vmin; margin: 0 0 1.2vmin; }
  #ghint b { color: var(--teal); margin-right: .8vmin; }
  /* Customer countdown: quiet until it matters. */
  #sessclock { font-family: var(--cond); font-weight: 700; font-size: 2.6vmin; letter-spacing: .1em;
               color: var(--amber); font-variant-numeric: tabular-nums; margin-left: 2vmin; white-space: nowrap; flex: none; }
  #sessclock.low { color: var(--red); animation: sesspulse 1.2s ease-in-out infinite; }
  #sessclock.up { color: var(--red); }
  @keyframes sesspulse { 50% { opacity: .5; } }
  /* On the idle screen too - people see it between games. */
  #idlesess { font-family: var(--cond); font-size: 2.6vmin; letter-spacing: .18em; text-transform: uppercase;
              color: var(--amber); margin-top: 1vmin; }
  #idlesess.up { color: var(--red); }
  #rows { display: flex; flex-direction: column; gap: 1.2vmin; overflow: hidden; flex: 1; }

  .row {
    background: var(--panel); border: 2px solid var(--line); border-radius: 1.6vmin;
    padding: 1.4vmin 2vmin; display: grid; grid-template-columns: 1fr auto; align-items: center;
    transition: border-color .25s, box-shadow .25s, background .25s;
  }
  .row.on { border-color: var(--pink); background: var(--panel); background: color-mix(in srgb, var(--panel) 82%, var(--pink)); box-shadow: 0 0 3vmin color-mix(in srgb, var(--pink) 30%, transparent); }
  .row .nm { font-family: var(--cond); font-weight: 700; font-size: 3.9vmin; text-transform: uppercase; letter-spacing: .03em; line-height: 1.05; }
  .row .big { font-family: var(--cond); font-weight: 700; font-size: 9vmin; line-height: .95; text-align: right; font-variant-numeric: tabular-nums; }
  .row.on .big { color: var(--teal); text-shadow: 0 0 2.4vmin color-mix(in srgb, var(--teal) 45%, transparent); }
  .row .chips { display: flex; gap: 1.4vmin; flex-wrap: wrap; margin-top: .5vmin; }
  .chip { font-family: var(--cond); font-size: 1.85vmin; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .chip b { color: var(--ink); font-weight: 700; margin-left: .4vmin; }
  .legs { font-family: var(--cond); font-size: 2vmin; letter-spacing: .14em; text-transform: uppercase; color: var(--amber); }
  /* Legs as pips (won / to win), readable from the oche on a 40" screen */
  .bigline { display: flex; align-items: baseline; justify-content: flex-end; gap: 1.6vmin; }
  .pips { font-size: 2.8vmin; letter-spacing: .5vmin; color: var(--amber); line-height: 1; white-space: nowrap; }
  .pips .o { color: var(--muted); }
  /* What the big number counts (strokes, runs, lives...) */
  .plabel { font-family: var(--cond); font-size: 2.2vmin; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  /* Who is throwing, in words as well as colour */
  .row .thr { display: inline-block; vertical-align: middle; margin-left: 1.4vmin; font-family: var(--cond); font-weight: 700;
              font-size: 2.2vmin; letter-spacing: .14em; color: #1b1300; background: var(--pink); border-radius: .6vmin; padding: .2vmin .9vmin; }
  .co { font-family: var(--cond); font-size: 2.2vmin; letter-spacing: .08em; color: var(--amber); margin-top: .5vmin; }
  .co b { background: color-mix(in srgb, var(--amber) 14%, transparent); border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent); border-radius: .6vmin; padding: 0 .8vmin; margin-right: .5vmin; font-weight: 700; }

  /* cricket marks */
  .marks { display: flex; gap: 1vmin; margin-top: .7vmin; }
  .mk { text-align: center; min-width: 4.4vmin; }
  .mk .t { font-family: var(--cond); font-size: 1.8vmin; color: var(--muted); letter-spacing: .06em; }
  .mk .v { font-family: var(--cond); font-weight: 700; font-size: 2.6vmin; color: var(--muted); }
  .mk.p1 .v { color: var(--ink); } .mk.p2 .v { color: var(--amber); }
  .mk.p3 .v { color: var(--teal); }
  .mk.dead .t, .mk.dead .v { opacity: .3; text-decoration: line-through; }

  /* Noughts & Crosses: the shared 3x3 grid every player can see at once. It
     sits BESIDE the player rows (#rowsarea is a flex row), never under them:
     stacked, four rows plus a grid overflowed #rows and the fixed turn card
     at the bottom of the screen covered cells 1 and 2 for ten seconds a visit. */
  #rowsarea { display: flex; gap: 2vmin; flex: 1; min-height: 0; }
  #rowsarea #rows { flex: 1; min-width: 0; }
  .oxogrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2vmin; width: 40vmin; flex: none; align-self: flex-start; }
  .oxocell {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    background: var(--panel); border: 2px solid var(--line); border-radius: 1.4vmin;
    font-family: var(--cond); font-weight: 700; font-size: 5vmin; letter-spacing: .04em; color: var(--muted);
    transition: background .25s, border-color .25s, color .25s, transform .2s;
  }
  /* Tinted panel + accent border/text, same recipe as .row.on - not a solid
     fill, so it stays readable whatever the accent's own lightness is. The
     seat colours are their own tokens (common.css --claim0..3): the house
     accents collide (pink = amber in two themes, green = the border colour in
     the default theme) and pink is the active-row colour, which must never
     double as "seat 0's cells". */
  .oxocell.p0 { color: var(--claim0); border-color: var(--claim0); background: color-mix(in srgb, var(--panel) 78%, var(--claim0)); }
  .oxocell.p1 { color: var(--claim1); border-color: var(--claim1); background: color-mix(in srgb, var(--panel) 78%, var(--claim1)); }
  .oxocell.p2 { color: var(--claim2); border-color: var(--claim2); background: color-mix(in srgb, var(--panel) 78%, var(--claim2)); }
  .oxocell.p3 { color: var(--claim3); border-color: var(--claim3); background: color-mix(in srgb, var(--panel) 78%, var(--claim3)); }
  .oxocell.won { transform: scale(1.08); box-shadow: 0 0 3vmin color-mix(in srgb, var(--ink) 45%, transparent); }

  .bar { height: .8vmin; background: var(--line); border-radius: 1vmin; overflow: hidden; margin-top: .8vmin; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--teal), var(--pink)); }

  #foot { font-family: var(--cond); font-size: 1.9vmin; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); text-align: center; border-top: 2px solid var(--line); padding-top: 1vmin; }
  #foot .live { color: var(--teal); } #foot .warn { color: var(--amber); }

  /* ---- celebration layer ---- */
  /* ---- visit card: the just-finished turn, held up long enough to read ---- */
  #turncard {
    position: fixed; left: 50%; bottom: 5vmin; transform: translateX(-50%) translateY(calc(100% + 6vmin));
    z-index: 55;                      /* under celebrations, over the game */
    visibility: hidden;               /* gone, not peeking over the bottom edge */
    display: flex; align-items: center; gap: 3.2vmin;
    background: color-mix(in srgb, var(--panel) 88%, black);
    border: 2px solid color-mix(in srgb, var(--pink) 55%, transparent);
    border-radius: 2vmin; padding: 2vmin 3.4vmin 2.6vmin;
    box-shadow: 0 1.6vmin 5vmin rgba(0,0,0,.5);
    transition: transform .35s cubic-bezier(.2,.9,.3,1.1), visibility 0s linear .35s;
    pointer-events: none; overflow: hidden;
  }
  #turncard.show { transform: translateX(-50%) translateY(0); visibility: visible;
                   transition: transform .35s cubic-bezier(.2,.9,.3,1.1), visibility 0s; }
  #tc-name { font-family: var(--cond); font-weight: 700; font-size: 3.4vmin; letter-spacing: .1em;
             text-transform: uppercase; color: var(--muted); max-width: 26vmin;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tc-total { font-family: var(--cond); font-weight: 700; font-size: 9vmin; line-height: 1; color: var(--amber); }
  #tc-darts { font-family: var(--cond); font-size: 3vmin; letter-spacing: .14em; color: var(--ink); }
  #tc-darts b { color: var(--pink); }
  #tc-bar { position: absolute; left: 0; bottom: 0; height: .7vmin; width: 100%;
            background: color-mix(in srgb, var(--line) 60%, transparent); }
  #tc-bar i { display: block; height: 100%; width: 100%; background: var(--pink); transform-origin: left; }
  #turncard.show #tc-bar i { animation: tc-drain linear forwards; animation-duration: var(--tc-hold, 10s); }
  @keyframes tc-drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  #cel { position: fixed; inset: 0; z-index: 60; pointer-events: none; display: none; align-items: center; justify-content: center; flex-direction: column; }
  #cel.show { display: flex; }
  #cel .backdrop { position: absolute; inset: 0; background: radial-gradient(60% 60% at 50% 45%, color-mix(in srgb, var(--pink) 20%, transparent), rgba(6,8,12,.66)); }
  #celtext {
    position: relative; font-family: var(--cond); font-weight: 700; text-transform: uppercase;
    font-size: 13vmin; line-height: .95; text-align: center; letter-spacing: .02em;
    color: #fff; text-shadow: 0 0 4vmin color-mix(in srgb, var(--pink) 90%, transparent), 0 0 10vmin color-mix(in srgb, var(--amber) 60%, transparent);
    animation: celin .6s cubic-bezier(.2,1.6,.4,1);
  }
  #celbrand { position: absolute; left: 0; right: 0; top: 6vmin; justify-content: center; font-size: 1.5vmin; opacity: .45; }
  body.celfull #brandbar { visibility: hidden; }   /* one venue mark on a full-screen card, not two */
  #celsub { position: relative; margin-top: 1.5vmin; font-family: var(--cond); font-size: 3.4vmin; letter-spacing: .3em; text-transform: uppercase; color: var(--amber); }
  #celmedia { position: relative; max-width: 52vmin; max-height: 42vh; margin-top: 2vmin; border-radius: 1.6vmin; box-shadow: 0 0 6vmin rgba(0,0,0,.6); }
  @keyframes celin { 0% { transform: scale(.3) rotate(-8deg); opacity: 0; } 60% { transform: scale(1.12) rotate(3deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
  #cel.bust #celtext { color: var(--red); text-shadow: 0 0 4vmin color-mix(in srgb, var(--red) 90%, transparent); }
  /* Broadcast graphics: only the big moments (180, game shot, a win, the
     prize, Shanghai, a hole in one) take the whole screen. Everything else is
     a slim strap across the top of the scoreboard - the board, the scores
     and the visit card stay in view, as on a TV darts broadcast. */
  #cel.strap { inset: auto; left: var(--sl, 50%); top: var(--st, 12vmin); width: var(--sw, 50%);
    flex-direction: row; align-items: center; justify-content: flex-start; gap: 2.4vmin;
    padding: 1.4vmin 2.6vmin; border-radius: 1.2vmin; overflow: hidden;
    background: #0d1712; background: color-mix(in srgb, var(--panel) 90%, black);
    border: 2px solid var(--line); border-left: .7vmin solid var(--amber);
    box-shadow: 0 1vmin 4vmin rgba(0,0,0,.55); animation: strapin .25s ease-out; }
  #cel.strap .backdrop, #cel.strap #celbrand, #cel.strap #celmedia { display: none; }
  #cel.strap #celtext { font-size: 6vmin; line-height: 1; text-align: left; text-shadow: none; animation: none;
    display: flex; gap: 1.6vmin; white-space: nowrap; }
  #cel.strap #celsub { margin-top: 0; font-size: 2.8vmin; letter-spacing: .14em; color: var(--amber); line-height: 1.15;
    min-width: 0; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
  #cel.strap.minor { padding: 1vmin 2.2vmin; }
  #cel.strap.minor #celtext { font-size: 4.4vmin; }
  #cel.strap.minor #celsub { font-size: 2.3vmin; }
  #cel.strap.bust { border-left-color: var(--red); }
  #cel.strap.bust #celtext { color: var(--red); text-shadow: none; }
  #cel.strap.bust #celsub { color: var(--ink); }
  @keyframes strapin { from { transform: translateX(-4vmin); opacity: 0; } to { transform: none; opacity: 1; } }
  #confetti { position: fixed; inset: 0; z-index: 61; pointer-events: none; }

  /* ---- walk-on: the game, the order and who throws first, as play starts ---- */
  #intro { position: fixed; left: 2vmin; right: 2vmin; bottom: 4vmin; z-index: 56; pointer-events: none;
    display: flex; align-items: center; gap: 3vmin; padding: 2vmin 3vmin;
    background: #0d1712; background: color-mix(in srgb, var(--panel) 92%, black);
    border: 2px solid var(--line); border-left: .9vmin solid var(--pink); border-radius: 1.6vmin;
    box-shadow: 0 1.4vmin 5vmin rgba(0,0,0,.55); animation: introin .35s ease-out; }
  @keyframes introin { from { transform: translateY(6vmin); opacity: 0; } to { transform: none; opacity: 1; } }
  #in-game { flex: none; max-width: 26%; }
  #in-title { font-family: var(--cond); font-weight: 700; font-size: 4.6vmin; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); line-height: 1; }
  #in-sub { font-family: var(--cond); font-size: 2.3vmin; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: .6vmin;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #in-order { flex: 1 1 auto; display: flex; flex-wrap: wrap; gap: 1vmin 2.4vmin; align-items: center; min-width: 0; }
  #in-order .plate { font-family: var(--cond); font-weight: 700; font-size: 3.6vmin; letter-spacing: .05em; text-transform: uppercase;
                     color: var(--ink); white-space: nowrap; }
  #in-order .plate b { display: inline-grid; place-items: center; width: 4vmin; height: 4vmin; margin-right: 1vmin; border-radius: 50%;
                       font-size: 2.4vmin; color: #fff; background: var(--line); vertical-align: middle; }
  #in-order .plate.first b { background: var(--pink); }
  #in-order.many .plate { font-size: 2.7vmin; } #in-order.many .plate b { width: 3.2vmin; height: 3.2vmin; font-size: 2vmin; }
  #in-right { flex: 0 1 auto; max-width: 40%; min-width: 0; text-align: right; }
  #in-first { font-family: var(--cond); font-weight: 700; font-size: 3.4vmin; letter-spacing: .1em; text-transform: uppercase; color: var(--pink);
              line-height: 1.1; text-wrap: balance; overflow-wrap: anywhere; }
  #in-extra { font-family: var(--cond); font-size: 2.4vmin; letter-spacing: .14em; text-transform: uppercase; color: var(--amber); margin-top: .6vmin; line-height: 1.5; }
  #in-extra .tag { color: #1b1300; background: var(--gold, #d4af37); border-radius: .6vmin; padding: .2vmin .9vmin; margin-right: 1.2vmin; font-weight: 700; }

  /* ---- end of game: the stats board, until the next game ---- */
  #final { position: fixed; inset: 0; z-index: 52; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2.6vmin; padding: 5vmin 6vmin; background: var(--bg); background: color-mix(in srgb, var(--bg) 94%, transparent);
    text-align: center; animation: finalin .6s ease-out; }
  @keyframes finalin { from { opacity: 0; } to { opacity: 1; } }
  /* The session clock and the hub/board status line stay in view over it */
  body.fulltime #sessclock, body.fulltime #foot { position: relative; z-index: 53; }
  #fn-head { font-family: var(--cond); font-weight: 700; font-size: 10vmin; line-height: 1; letter-spacing: .04em; text-transform: uppercase; color: var(--gold, #d4af37); }
  #fn-title { font-family: var(--cond); font-size: 3vmin; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  #fn-cols { display: grid; gap: 2vmin; width: 100%; max-width: 160vmin; grid-template-columns: repeat(var(--fc, 2), minmax(0, 1fr)); }
  .fn-col { background: var(--panel); border: 2px solid var(--line); border-radius: 1.6vmin; padding: 2vmin 2.4vmin; min-width: 0; }
  .fn-col.win { border-color: var(--gold, #d4af37); box-shadow: 0 0 3vmin color-mix(in srgb, var(--gold, #d4af37) 30%, transparent); }
  .fn-nm { font-family: var(--cond); font-weight: 700; font-size: 4vmin; text-transform: uppercase; letter-spacing: .04em;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fn-col.win .fn-nm { color: var(--gold, #d4af37); }
  .fn-big { font-family: var(--cond); font-weight: 700; font-size: 7vmin; line-height: 1; margin-top: .8vmin; font-variant-numeric: tabular-nums; }
  .fn-lbl { font-family: var(--cond); font-size: 2.2vmin; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .fn-stats { display: flex; flex-wrap: wrap; justify-content: center; gap: .6vmin 2vmin; margin-top: 1.2vmin;
              font-family: var(--cond); font-size: 2.4vmin; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .fn-stats b { color: var(--ink); margin-left: .5vmin; }
  #fn-cols.many .fn-nm { font-size: 3vmin; } #fn-cols.many .fn-big { font-size: 5vmin; } #fn-cols.many .fn-stats { font-size: 2.2vmin; }
  #fn-tally { font-family: var(--cond); font-weight: 700; font-size: 3.2vmin; letter-spacing: .16em; text-transform: uppercase; color: var(--amber); }
  #fn-prompt { font-family: var(--cond); font-size: 2.9vmin; letter-spacing: .18em; text-transform: uppercase; color: var(--ink); }
  #fn-prompt.flash { color: var(--pink); }
  .shake { animation: shake .5s; }
  @keyframes shake { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-1vmin,.6vmin); } 40% { transform: translate(1vmin,-.5vmin); } 60% { transform: translate(-.7vmin,-.4vmin); } 80% { transform: translate(.6vmin,.5vmin); } }

  /* ---- idle ---- */
  #idle { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vmin; text-align: center; }
  #idle.hidden { display: none; }
  #idle svg { width: 34vmin; opacity: .3; }
  #idlebrand { font-size: 4.4vmin; }
  #idlebrand .brand-name { color: var(--ink); }
  #idlebrand .brand-tag { color: var(--pink); }
  #idle p { font-family: var(--cond); font-size: 2.8vmin; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
  /* Shown when the board reports a dart with no game running - the thrower is
     looking at the TV, so the nudge has to be here, not only on the iPad. */
  #idlelive { color: var(--pink); margin-top: 1.6vmin; animation: livepulse 1.6s ease-in-out infinite; }
  #idlelive b { color: var(--ink); }
  @keyframes livepulse { 50% { opacity: .45; } }
  #idlemain { display: flex; align-items: center; gap: 5vmin; }
  #idle .addr { margin-top: 3vmin; text-align: left; }
  #idle .a-row { display: flex; align-items: baseline; gap: 2vmin; margin-top: 1.2vmin; }
  #idle .a-k { font-family: var(--cond); font-size: 2.1vmin; letter-spacing: .18em; text-transform: uppercase;
               color: var(--muted); min-width: 22vmin; }
  #idle .a-v { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 2.9vmin; font-weight: 600; color: var(--ink); }
  #idle .a-v.hi { color: var(--pink); }
  #idleqr { display: flex; flex-direction: column; align-items: center; gap: 1vmin; }
  #idleqr img { width: 26vmin; height: 26vmin; background: #fff; padding: 1.2vmin; border-radius: 1.6vmin; }
  #idleqr .qrcap { font-size: 1.9vmin; letter-spacing: .18em; }
  /* ---- screen saver: the venue's own pictures and videos, after a while unused ---- */
  #saver { position: fixed; inset: 0; z-index: 150; background: #000; opacity: 0; transition: opacity .8s ease; }
  #saver.on { opacity: 1; }
  #saver img, #saver video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    background: #000; opacity: 0; transition: opacity .8s ease; }
  #saver img.on, #saver video.on { opacity: 1; }
  #standby { position: fixed; inset: 0; z-index: 200; background: #000; display: flex;
    flex-direction: column; align-items: center; justify-content: center; gap: 2vmin; }
  #standby .nm { font-family: var(--cond); font-weight: 700; letter-spacing: .3em;
    text-transform: uppercase; font-size: 3vmin; color: #2a2a2a; }
</style>
</head>
<body>
<div id="standby" hidden><div class="nm" id="standby-name"></div></div>
<div id="saver" hidden><img id="saverimg" alt=""></div>   <!-- each video's player is made, then removed, by tv.js -->

<div id="tv">
  <div id="left">
    <div id="boardwrap">
      <svg id="board" role="img" aria-label="Live dartboard"></svg>
      <div id="watermark"><div id="wmbrand"></div></div>
      <div id="hit"><span id="hittext"></span></div>
    </div>
    <div id="visit">
      <div class="slot" id="s0">·</div><div class="slot" id="s1">·</div><div class="slot" id="s2">·</div>
    </div>
    <div id="visitsum"><span id="visitlabel">&nbsp;</span><span id="visitnum"></span></div>
  </div>

  <div id="right">
    <div id="brandbar"><div id="tvbrand"></div><div id="brandline"></div></div>
    <div id="head">
      <span id="gtitle">Darts</span>
      <span id="gbug" hidden></span>
      <span id="gsub"></span>
      <span id="sessclock" hidden></span>
    </div>
    <div id="ghint" hidden></div>
    <div id="rowsarea"><div id="rows"></div></div>
    <div id="foot"><span class="live">●</span> waiting…</div>
  </div>
</div>

<!-- Visit card: what the finishing player just scored, held so they can read it -->
<div id="turncard">
  <div id="tc-name"></div>
  <div id="tc-total"></div>
  <div id="tc-darts"></div>
  <div id="tc-bar"><i></i></div>
</div>

<!-- Walk-on: the game, the throwing order and who throws first -->
<div id="intro" hidden>
  <div id="in-game"><div id="in-title"></div><div id="in-sub"></div></div>
  <div id="in-order"></div>
  <div id="in-right"><div id="in-first"></div><div id="in-extra"></div></div>
</div>

<!-- End of game: the stats board, until the next game starts -->
<div id="final" hidden>
  <div id="fn-head"></div>
  <div id="fn-title"></div>
  <div id="fn-cols"></div>
  <div id="fn-tally" hidden></div>
  <div id="fn-prompt"></div>
</div>

<div id="cel"><div class="backdrop"></div><div id="celbrand"></div><div id="celtext"></div><div id="celsub"></div><img id="celmedia" hidden alt=""></div>
<canvas id="confetti"></canvas>

<div id="idle">
  <div id="idlemain">
    <svg id="idleboard"></svg>
    <div>
      <div id="idlebrand"></div>
      <p>Set up a game on the control tablet</p>
      <p id="idlelive" hidden>● Board is live — <b id="idlelivedart"></b> detected. Start a game to score it.</p>
      <p id="idlesess" hidden></p>
      <div class="addr">
        <div class="a-row"><span class="a-k">This TV screen</span><span class="a-v" id="idle-tv">…</span></div>
        <div class="a-row"><span class="a-k">iPad control panel</span><span class="a-v hi" id="idle-pad">…</span></div>
      </div>
    </div>
  </div>
  <div id="idleqr">
    <img id="idleqrimg" alt="">
    <p class="qrcap">Scan to open the control panel</p>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/keepawake.js"></script>
<script src="/js/build.js"></script>
<script src="/js/brand.js"></script>
<script src="/js/board-svg.js"></script>
<script src="/js/tv.js"></script>
</body>
</html>
