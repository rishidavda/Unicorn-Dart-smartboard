<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Winchester · TV</title>
<link rel="icon" href="/brand/icon.png" type="image/png">
<link rel="stylesheet" href="/css/common.css">
<style>
  body { overflow: hidden; cursor: none; }
  #tv { display: grid; grid-template-columns: minmax(0, 46%) 1fr; gap: 2vmin; height: 100vh; padding: 2vmin; }

  /* ---- left: board ---- */
  #left { display: flex; flex-direction: column; gap: 1.4vmin; min-height: 0; }
  #boardwrap { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #board { width: 100%; height: 100%; max-height: 100%; }
  #hit { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; }
  #hit span {
    font-size: 15vmin; line-height: 1; color: var(--amber); font-family: var(--cond); font-weight: 700;
    text-shadow: 0 0 3vmin color-mix(in srgb, var(--amber) 90%, transparent), 0 0 9vmin color-mix(in srgb, var(--amber) 45%, transparent);
  }
  #hit.go { animation: hitpop 1.5s ease-out; }
  @keyframes hitpop {
    0% { opacity: 0; transform: scale(.55) rotate(-6deg); }
    14% { opacity: 1; transform: scale(1.08) rotate(2deg); }
    26% { transform: scale(1) rotate(0); }
    72% { opacity: 1; }
    100% { opacity: 0; transform: scale(1.05); }
  }
  .db-hit { animation: bedflash 1.5s ease-out; }
  @keyframes bedflash { 0%,100% { fill: inherit; } 12%,58% { fill: var(--amber); } }

  #brandbar { display: flex; align-items: center; gap: 2vmin; margin-bottom: .8vmin; min-height: 5vmin; }
  #tvbrand { font-size: 1.9vmin; }
  #tvbrand .brand-tag { letter-spacing: .3em; }
  #brandline { flex: 1; height: 2px; background: linear-gradient(90deg, var(--pink), transparent); }
  #watermark {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; opacity: .06; font-size: 3vmin;
  }
  #watermark .brand-name { font-size: 3.4em; } #watermark .brand-tag { display: none; }

  #visit { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2vmin; }
  .slot {
    background: var(--panel); border: 2px dashed var(--line); border-radius: 1.2vmin;
    min-height: 8vmin; display: flex; align-items: center; justify-content: center;
    font-family: var(--cond); font-weight: 700; font-size: 4.6vmin; color: var(--muted);
  }
  .slot.was { border-style: solid; border-color: var(--line); color: var(--muted); }
  .slot.on { border-style: solid; border-color: var(--amber); color: var(--amber); text-shadow: 0 0 1.6vmin color-mix(in srgb, var(--amber) 60%, transparent); }
  #visitsum { text-align: center; font-family: var(--cond); font-size: 2.1vmin; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }

  /* ---- right: scoreboard ---- */
  #right { display: flex; flex-direction: column; gap: 1.4vmin; min-height: 0; }
  #head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 3px solid var(--line); padding-bottom: 1vmin; }
  #gtitle { font-family: var(--cond); font-weight: 700; font-size: 3.8vmin; letter-spacing: .1em; text-transform: uppercase; color: var(--teal); }
  #gsub { font-family: var(--cond); font-size: 2.2vmin; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  #ghint { font-family: var(--cond); font-size: 2.6vmin; letter-spacing: .06em; color: var(--gold);
    background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .1); border-radius: 1.2vmin;
    padding: 1vmin 1.6vmin; margin: 0 0 1.2vmin; }
  #ghint b { color: var(--teal); margin-right: .8vmin; }
  /* Customer countdown: quiet until it matters. */
  #sessclock { font-family: var(--cond); font-weight: 700; font-size: 2.6vmin; letter-spacing: .1em;
               color: var(--amber); font-variant-numeric: tabular-nums; }
  #sessclock.low { color: var(--red); animation: sesspulse 1.2s ease-in-out infinite; }
  #sessclock.up { color: var(--red); }
  @keyframes sesspulse { 50% { opacity: .5; } }
  /* On the idle screen too - people see it between games. */
  #idlesess { font-family: var(--cond); font-size: 2.6vmin; letter-spacing: .18em; text-transform: uppercase;
              color: var(--amber); margin-top: 1vmin; }
  #idlesess.up { color: var(--red); }
  #rows { display: flex; flex-direction: column; gap: 1.2vmin; overflow: hidden; flex: 1; }

  .row {
    background: var(--panel); border: 2px solid var(--line); border-radius: 1.6vmin;
    padding: 1.4vmin 2vmin; display: grid; grid-template-columns: 1fr auto; align-items: center;
    transition: border-color .25s, box-shadow .25s, background .25s;
  }
  .row.on { border-color: var(--pink); background: var(--panel); background: color-mix(in srgb, var(--panel) 82%, var(--pink)); box-shadow: 0 0 3vmin color-mix(in srgb, var(--pink) 30%, transparent); }
  .row .nm { font-family: var(--cond); font-weight: 700; font-size: 3.9vmin; text-transform: uppercase; letter-spacing: .03em; line-height: 1.05; }
  .row .big { font-family: var(--cond); font-weight: 700; font-size: 9vmin; line-height: .95; text-align: right; font-variant-numeric: tabular-nums; }
  .row.on .big { color: var(--teal); text-shadow: 0 0 2.4vmin color-mix(in srgb, var(--teal) 45%, transparent); }
  .row .chips { display: flex; gap: 1.4vmin; flex-wrap: wrap; margin-top: .5vmin; }
  .chip { font-family: var(--cond); font-size: 1.85vmin; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .chip b { color: var(--ink); font-weight: 700; margin-left: .4vmin; }
  .legs { font-family: var(--cond); font-size: 2vmin; letter-spacing: .14em; text-transform: uppercase; color: var(--amber); }
  .co { font-family: var(--cond); font-size: 2.2vmin; letter-spacing: .08em; color: var(--amber); margin-top: .5vmin; }
  .co b { background: color-mix(in srgb, var(--amber) 14%, transparent); border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent); border-radius: .6vmin; padding: 0 .8vmin; margin-right: .5vmin; font-weight: 700; }

  /* cricket marks */
  .marks { display: flex; gap: 1vmin; margin-top: .7vmin; }
  .mk { text-align: center; min-width: 4.4vmin; }
  .mk .t { font-family: var(--cond); font-size: 1.8vmin; color: var(--muted); letter-spacing: .06em; }
  .mk .v { font-family: var(--cond); font-weight: 700; font-size: 2.6vmin; color: var(--muted); }
  .mk.p1 .v { color: var(--ink); } .mk.p2 .v { color: var(--amber); }
  .mk.p3 .v { color: var(--teal); }
  .mk.dead .t, .mk.dead .v { opacity: .3; text-decoration: line-through; }

  .bar { height: .8vmin; background: var(--line); border-radius: 1vmin; overflow: hidden; margin-top: .8vmin; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--teal), var(--pink)); }

  #foot { font-family: var(--cond); font-size: 1.9vmin; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); text-align: center; border-top: 2px solid var(--line); padding-top: 1vmin; }
  #foot .live { color: var(--teal); } #foot .warn { color: var(--amber); }

  /* ---- celebration layer ---- */
  /* ---- visit card: the just-finished turn, held up long enough to read ---- */
  #turncard {
    position: fixed; left: 50%; bottom: 5vmin; transform: translateX(-50%) translateY(140%);
    z-index: 55;                      /* under celebrations, over the game */
    display: flex; align-items: center; gap: 3.2vmin;
    background: color-mix(in srgb, var(--panel) 88%, black);
    border: 2px solid color-mix(in srgb, var(--pink) 55%, transparent);
    border-radius: 2vmin; padding: 2vmin 3.4vmin 2.6vmin;
    box-shadow: 0 1.6vmin 5vmin rgba(0,0,0,.5);
    transition: transform .35s cubic-bezier(.2,.9,.3,1.1);
    pointer-events: none; overflow: hidden;
  }
  #turncard.show { transform: translateX(-50%) translateY(0); }
  #tc-name { font-family: var(--cond); font-weight: 700; font-size: 3.4vmin; letter-spacing: .1em;
             text-transform: uppercase; color: var(--muted); max-width: 26vmin;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tc-total { font-family: var(--cond); font-weight: 700; font-size: 9vmin; line-height: 1; color: var(--amber); }
  #tc-darts { font-family: var(--cond); font-size: 3vmin; letter-spacing: .14em; color: var(--ink); }
  #tc-darts b { color: var(--pink); }
  #tc-bar { position: absolute; left: 0; bottom: 0; height: .7vmin; width: 100%;
            background: color-mix(in srgb, var(--line) 60%, transparent); }
  #tc-bar i { display: block; height: 100%; width: 100%; background: var(--pink); transform-origin: left; }
  #turncard.show #tc-bar i { animation: tc-drain linear forwards; animation-duration: var(--tc-hold, 10s); }
  @keyframes tc-drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  #cel { position: fixed; inset: 0; z-index: 60; pointer-events: none; display: none; align-items: center; justify-content: center; flex-direction: column; }
  #cel.show { display: flex; }
  #cel .backdrop { position: absolute; inset: 0; background: radial-gradient(60% 60% at 50% 45%, color-mix(in srgb, var(--pink) 20%, transparent), rgba(6,8,12,.66)); }
  #celtext {
    position: relative; font-family: var(--cond); font-weight: 700; text-transform: uppercase;
    font-size: 13vmin; line-height: .95; text-align: center; letter-spacing: .02em;
    color: #fff; text-shadow: 0 0 4vmin color-mix(in srgb, var(--pink) 90%, transparent), 0 0 10vmin color-mix(in srgb, var(--amber) 60%, transparent);
    animation: celin .6s cubic-bezier(.2,1.6,.4,1);
  }
  #celbrand { position: absolute; left: 0; right: 0; bottom: 9vmin; justify-content: center; font-size: 1.5vmin; opacity: .45; }
  #celsub { position: relative; margin-top: 1.5vmin; font-family: var(--cond); font-size: 3.4vmin; letter-spacing: .3em; text-transform: uppercase; color: var(--amber); }
  #celmedia { position: relative; max-width: 52vmin; max-height: 42vh; margin-top: 2vmin; border-radius: 1.6vmin; box-shadow: 0 0 6vmin rgba(0,0,0,.6); }
  @keyframes celin { 0% { transform: scale(.3) rotate(-8deg); opacity: 0; } 60% { transform: scale(1.12) rotate(3deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
  #cel.bust #celtext { color: var(--red); text-shadow: 0 0 4vmin color-mix(in srgb, var(--red) 90%, transparent); }
  #confetti { position: fixed; inset: 0; z-index: 61; pointer-events: none; }
  .shake { animation: shake .5s; }
  @keyframes shake { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-1vmin,.6vmin); } 40% { transform: translate(1vmin,-.5vmin); } 60% { transform: translate(-.7vmin,-.4vmin); } 80% { transform: translate(.6vmin,.5vmin); } }

  /* ---- idle ---- */
  #idle { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vmin; text-align: center; }
  #idle.hidden { display: none; }
  #idle svg { width: 34vmin; opacity: .3; }
  #idlebrand { font-size: 4.4vmin; }
  #idlebrand .brand-name { color: var(--ink); }
  #idlebrand .brand-tag { color: var(--pink); }
  #idle p { font-family: var(--cond); font-size: 2.8vmin; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
  /* Shown when the board reports a dart with no game running - the thrower is
     looking at the TV, so the nudge has to be here, not only on the iPad. */
  #idlelive { color: var(--pink); margin-top: 1.6vmin; animation: livepulse 1.6s ease-in-out infinite; }
  #idlelive b { color: var(--ink); }
  @keyframes livepulse { 50% { opacity: .45; } }
  #idlemain { display: flex; align-items: center; gap: 5vmin; }
  #idle .addr { margin-top: 3vmin; text-align: left; }
  #idle .a-row { display: flex; align-items: baseline; gap: 2vmin; margin-top: 1.2vmin; }
  #idle .a-k { font-family: var(--cond); font-size: 2.1vmin; letter-spacing: .18em; text-transform: uppercase;
               color: var(--muted); min-width: 22vmin; }
  #idle .a-v { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 2.9vmin; font-weight: 600; color: var(--ink); }
  #idle .a-v.hi { color: var(--pink); }
  #idleqr { display: flex; flex-direction: column; align-items: center; gap: 1vmin; }
  #idleqr img { width: 26vmin; height: 26vmin; background: #fff; padding: 1.2vmin; border-radius: 1.6vmin; }
  #idleqr .qrcap { font-size: 1.9vmin; letter-spacing: .18em; }
</style>
</head>
<body>

<div id="tv">
  <div id="left">
    <div id="boardwrap">
      <svg id="board" role="img" aria-label="Live dartboard"></svg>
      <div id="watermark"><div id="wmbrand"></div></div>
      <div id="hit"><span id="hittext"></span></div>
    </div>
    <div id="visit">
      <div class="slot" id="s0">·</div><div class="slot" id="s1">·</div><div class="slot" id="s2">·</div>
    </div>
    <div id="visitsum">&nbsp;</div>
  </div>

  <div id="right">
    <div id="brandbar"><div id="tvbrand"></div><div id="brandline"></div></div>
    <div id="head">
      <span id="gtitle">Darts</span>
      <span id="gsub"></span>
      <span id="sessclock" hidden></span>
    </div>
    <div id="ghint" hidden></div>
    <div id="rows"></div>
    <div id="foot"><span class="live">●</span> waiting…</div>
  </div>
</div>

<!-- Visit card: what the finishing player just scored, held so they can read it -->
<div id="turncard">
  <div id="tc-name"></div>
  <div id="tc-total"></div>
  <div id="tc-darts"></div>
  <div id="tc-bar"><i></i></div>
</div>

<div id="cel"><div class="backdrop"></div><div id="celbrand"></div><div id="celtext"></div><div id="celsub"></div><img id="celmedia" hidden alt=""></div>
<canvas id="confetti"></canvas>

<div id="idle">
  <div id="idlemain">
    <svg id="idleboard"></svg>
    <div>
      <div id="idlebrand"></div>
      <p>Set up a game on the control tablet</p>
      <p id="idlelive" hidden>● Board is live — <b id="idlelivedart"></b> detected. Start a game to score it.</p>
      <p id="idlesess" hidden></p>
      <div class="addr">
        <div class="a-row"><span class="a-k">This TV screen</span><span class="a-v" id="idle-tv">…</span></div>
        <div class="a-row"><span class="a-k">iPad control panel</span><span class="a-v hi" id="idle-pad">…</span></div>
      </div>
    </div>
  </div>
  <div id="idleqr">
    <img id="idleqrimg" alt="">
    <p class="qrcap">Scan to open the control panel</p>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/brand.js"></script>
<script src="/js/board-svg.js"></script>
<script src="/js/tv.js"></script>
</body>
</html>
